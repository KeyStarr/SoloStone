# Runs the public test suites (docs/TESTING.md, "ci" tier). It needs no Hearthstone files and downloads nothing from
# Blizzard: the only downloads are the .NET SDK and NuGet packages. The "client" tier needs a player's own client and
# never runs here.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older runs; runs on main always finish.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: 'Run every public suite (--ci: a skipped suite fails the run)'
        run: python tests/run.py --ci
